<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="styles.css?v=2">
    <link rel="stylesheet" href="dashboard.css?v=2">
    <style>
        .grade-grupos {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        .lista-grupos {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .item-grupo {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .item-grupo:hover, .item-grupo.ativo {
            background: rgba(37, 99, 235, 0.2);
            border-color: rgba(37, 99, 235, 0.5);
        }

        .item-grupo h3 {
            margin: 0 0 5px 0;
            color: var(--primary-color);
        }

        .item-grupo p {
            margin: 0;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .badge-papel {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-top: 8px;
        }

        .papel-admin { background: #fee2e2; color: #b91c1c; }
        .papel-membro { background: #dbeafe; color: #1d4ed8; }
        .papel-comum { background: #f3f4f6; color: #374151; }

        .membros-lista {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .item-membro {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .acoes-membro select {
            background: rgba(0, 0, 0, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 5px;
            border-radius: 4px;
            margin-right: 10px;
        }

        @media (max-width: 768px) {
            .grade-grupos {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <link rel="icon" href="IMG/logo.png" type="image/x-icon">
    <title>Agenda Web | Grupos</title>
    <script src="config.js"></script>
    <script src="script.js?v=2"></script>
</head>

<body>
    <div class="barra-lateral-dashboard">
        <div class="logo-barra-lateral">
            <a href="dashboard.html">
                <img class="logo" src="IMG/logo.png" alt="Logo Agenda Web">
            </a>
        </div>

        <nav class="barra-navegacao-dashboard">
            <ul>
                <li><a href="dashboard.html">Painel</a></li>
                <li><a href="compromissos.html">Compromissos</a></li>
                <li><a href="grupos.html" class="ativo">Grupos</a></li>
                <li><a href="configuracoes.html">Configurações</a></li>
                <li><a href="perfil.html">Perfil</a></li>
                <li style="display: none;" class="admin-nav-item"><a href="admin.html">Administrador</a></li>
                <li><a href="sair.html">Sair</a></li>
            </ul>
        </nav>
    </div>

    <main class="conteudo-dashboard">
        <div class="grade-grupos">
            
            <section class="cartao-vidro">
                <div class="cabecalho-cartao" style="justify-content: space-between;">
                    <h2>Meus Grupos</h2>
                    <button id="btnNovoGrupo" class="botao-principal-vidro" style="padding: 6px 12px; font-size: 0.9rem;">+ Criar</button>
                </div>
                <div class="lista-grupos" id="listaGrupos">
                    <p class="mensagem-vazia">Carregando grupos...</p>
                </div>
            </section>

            <section class="cartao-vidro" id="detalhesGrupo" style="display: none;">
                <div class="cabecalho-cartao" style="justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; margin-bottom: 15px;">
                    <div>
                        <h2 id="grupoNomeTitulo" style="margin-bottom: 5px; color: var(--primary-color);">Nome do Grupo</h2>
                        <p id="grupoDescricaoDesc" style="color: var(--text-muted); font-size: 0.9rem;">Descrição do grupo aqui.</p>
                        <span id="meuPapelBadge" class="badge-papel papel-comum">Meu Papel</span>
                    </div>
                    <button id="btnExcluirGrupo" class="btn-secundario" style="color: #ef4444; border-color: #ef4444; display: none;">Excluir Grupo</button>
                </div>

                <div id="areaAdicionarMembro" style="display: none; background: rgba(0,0,0,0.1); padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                    <h3 style="margin-top: 0; font-size: 1rem; margin-bottom: 10px;">Adicionar Membro</h3>
                    <form id="formAdicionarMembro" style="display: flex; gap: 10px; align-items: center;">
                        <input type="email" id="novoMembroEmail" class="input-padrao" placeholder="E-mail do usuário" required style="flex: 1;">
                        <select id="novoMembroPapel" class="input-padrao" style="width: 120px;">
                            <option value="comum">Comum</option>
                            <option value="membro">Membro</option>
                            <option value="admin">Admin</option>
                        </select>
                        <button type="submit" class="botao-principal-vidro" style="padding: 10px 15px;">Adicionar</button>
                    </form>
                </div>

                <h3>Membros da Equipe</h3>
                <div class="membros-lista" id="listaMembros">
                    <!-- Gerado via JS -->
                </div>
            </section>

        </div>
    </main>

    <!-- Modal Criar Grupo -->
    <div id="modalCriarGrupo" class="modal-overlay" style="display: none;">
        <div class="modal-content cartao-vidro">
            <div class="modal-header">
                <h2>Criar Novo Grupo</h2>
                <button class="btn-fechar" id="fecharModalGrupo">&times;</button>
            </div>
            <div class="modal-body">
                <form id="formCriarGrupo">
                    <div class="form-group">
                        <label for="nomeGrupo">Nome do Grupo</label>
                        <input type="text" id="nomeGrupo" class="input-padrao largura-total" required>
                    </div>
                    <div class="form-group">
                        <label for="descricaoGrupo">Descrição (Opcional)</label>
                        <textarea id="descricaoGrupo" class="input-padrao largura-total" rows="3"></textarea>
                    </div>
                    <div class="modal-footer">
                        <button type="button" id="btnCancelarGrupo" class="btn-secundario">Cancelar</button>
                        <button type="submit" class="botao-principal-vidro">Salvar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="grupos.js?v=1" defer></script>
</body>

</html>
